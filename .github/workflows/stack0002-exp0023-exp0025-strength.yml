name: STACK-0002 EXP0023 EXP0025

on:
  pull_request:
    paths:
      - 'experiments/STACK-0002-exp0023-exp0025.patch'
      - '.github/workflows/stack0002-exp0023-exp0025-strength.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-strength:
    if: ${{ github.event_name == 'workflow_dispatch' || github.head_ref == 'stack/0002-exp0023-exp0025' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ACCEPTED_CRAB_SHA: b93ab2b0f635adffb9129c57e6f1cc2e8700720a
      SF18_SHA: cb3d4ee9b47d0c5aae855b12379378ea1439675c
      ACCEPTED_CRAB_BENCH: '2673975'
      SF18_BENCH: '2050811'
      PATCH: experiments/STACK-0002-exp0023-exp0025.patch
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record provenance
        run: |
          set -euxo pipefail
          git rev-parse HEAD | tee /tmp/wrapper-sha.txt
          printf '%s\n' "$ACCEPTED_CRAB_SHA" | tee /tmp/accepted-crab-sha.txt
          printf '%s\n' "$SF18_SHA" | tee /tmp/sf18-sha.txt
          sha256sum "$PATCH" | tee /tmp/patch-sha256.txt
          gcc --version | head -1 | tee /tmp/gcc.txt
          clang++ --version | head -1 | tee /tmp/clang.txt
          lscpu | tee /tmp/cpu.txt

      - name: Verify patch scope and apply stack
        run: |
          set -euxo pipefail
          test "$(git merge-base HEAD "$ACCEPTED_CRAB_SHA")" = "$ACCEPTED_CRAB_SHA"
          git apply --check --directory=engine "$PATCH"
          git apply --directory=engine "$PATCH"
          git diff --check
          test "$(git diff --name-only -- engine | tr '\n' ' ')" = 'engine/src/search.cpp engine/src/tt.cpp engine/src/tt.h '
          git diff --binary -- engine/src/search.cpp engine/src/tt.cpp engine/src/tt.h | sha256sum | tee /tmp/engine-diff-sha256.txt
          git add engine/src/search.cpp engine/src/tt.cpp engine/src/tt.h
          git write-tree | tee /tmp/post-patch-tree.txt

      - name: Build stack GCC and deterministic bench
        run: |
          set -euxo pipefail
          make clean
          make -j2 build ARCH=x86-64-avx2 COMP=gcc
          cp engine/src/crab /tmp/crab-candidate-gcc
          printf 'uci\nisready\nquit\n' | /tmp/crab-candidate-gcc | tee /tmp/candidate-gcc-uci.txt
          grep -q '^id name Crab Chess ' /tmp/candidate-gcc-uci.txt
          grep -q '^id author Crab Chess contributors' /tmp/candidate-gcc-uci.txt
          /tmp/crab-candidate-gcc bench 2>&1 | tee /tmp/candidate-gcc-bench.txt
          grep 'Nodes searched' /tmp/candidate-gcc-bench.txt | tail -1 | grep -Eo '[0-9]+' | tail -1 | tee /tmp/candidate-bench-nodes.txt
          sha256sum /tmp/crab-candidate-gcc | tee /tmp/candidate-gcc-binary-sha256.txt

      - name: Build stack Clang and verify reproducible bench
        run: |
          set -euxo pipefail
          make clean
          make -j2 build ARCH=x86-64-avx2 COMP=clang
          cp engine/src/crab /tmp/crab-candidate
          printf 'uci\nisready\nquit\n' | /tmp/crab-candidate | tee /tmp/candidate-clang-uci.txt
          grep -q '^id name Crab Chess ' /tmp/candidate-clang-uci.txt
          grep -q '^id author Crab Chess contributors' /tmp/candidate-clang-uci.txt
          /tmp/crab-candidate bench 2>&1 | tee /tmp/candidate-clang-bench-1.txt
          /tmp/crab-candidate bench 2>&1 | tee /tmp/candidate-clang-bench-2.txt
          for f in /tmp/candidate-clang-bench-1.txt /tmp/candidate-clang-bench-2.txt; do grep 'Nodes searched' "$f" | tail -1 | grep -Eo '[0-9]+' | tail -1; done | tee /tmp/candidate-clang-node-runs.txt
          test "$(sed -n '1p' /tmp/candidate-clang-node-runs.txt)" = "$(cat /tmp/candidate-bench-nodes.txt)"
          test "$(sed -n '2p' /tmp/candidate-clang-node-runs.txt)" = "$(cat /tmp/candidate-bench-nodes.txt)"
          sha256sum /tmp/crab-candidate | tee /tmp/candidate-binary-sha256.txt

      - name: Stack sanitizer smoke
        run: |
          set -euxo pipefail
          make clean
          make -j2 build ARCH=x86-64 COMP=gcc sanitize='address undefined' debug=yes
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 sh -c "printf 'uci\nisready\nposition startpos\ngo depth 3\nquit\n' | ./engine/src/crab"

      - name: Build exact accepted Crab control
        run: |
          set -euxo pipefail
          git worktree add --detach /tmp/crab-baseline-src "$ACCEPTED_CRAB_SHA"
          make -C /tmp/crab-baseline-src -j2 build ARCH=x86-64-avx2 COMP=clang
          cp /tmp/crab-baseline-src/engine/src/crab /tmp/crab-baseline
          printf 'uci\nisready\nquit\n' | /tmp/crab-baseline | tee /tmp/baseline-uci.txt
          grep -q '^id name Crab Chess ' /tmp/baseline-uci.txt
          /tmp/crab-baseline bench 2>&1 | tee /tmp/baseline-bench.txt
          grep -Eq "Nodes searched[[:space:]]*:[[:space:]]*$ACCEPTED_CRAB_BENCH" /tmp/baseline-bench.txt
          sha256sum /tmp/crab-baseline | tee /tmp/baseline-binary-sha256.txt

      - name: Build immutable Stockfish 18 control
        run: |
          set -euxo pipefail
          git clone --filter=blob:none https://github.com/official-stockfish/Stockfish.git /tmp/stockfish
          git -C /tmp/stockfish checkout --detach "$SF18_SHA"
          test "$(git -C /tmp/stockfish rev-parse HEAD)" = "$SF18_SHA"
          make -C /tmp/stockfish/src -j2 build ARCH=x86-64-avx2 COMP=clang
          cp /tmp/stockfish/src/stockfish /tmp/sf18
          /tmp/sf18 bench 2>&1 | tee /tmp/sf18-bench.txt
          grep -Eq "Nodes searched[[:space:]]*:[[:space:]]*$SF18_BENCH" /tmp/sf18-bench.txt
          sha256sum /tmp/sf18 | tee /tmp/sf18-binary-sha256.txt

      - name: Verify networks and openings
        run: |
          set -euxo pipefail
          find engine/src -maxdepth 1 -type f -name 'nn-*.nnue' -print0 | sort -z | xargs -0 sha256sum | tee /tmp/candidate-network-sha256.txt
          find /tmp/crab-baseline-src/engine/src -maxdepth 1 -type f -name 'nn-*.nnue' -print0 | sort -z | xargs -0 sha256sum | tee /tmp/baseline-network-sha256.txt
          find /tmp/stockfish/src -maxdepth 1 -type f -name 'nn-*.nnue' -print0 | sort -z | xargs -0 sha256sum | tee /tmp/sf18-network-sha256.txt
          sha256sum tools/strength/openings.pgn | tee /tmp/openings-sha256.txt

      - name: Build pinned Cute Chess
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake qtbase5-dev libqt5svg5-dev
          git clone --depth 1 --branch v1.3.1 https://github.com/cutechess/cutechess.git /tmp/cutechess-src
          cmake -S /tmp/cutechess-src -B /tmp/cutechess-build -DCMAKE_BUILD_TYPE=Release -DWITH_TESTS=OFF
          cmake --build /tmp/cutechess-build --target cli -j2
          cp /tmp/cutechess-build/cutechess-cli /tmp/cutechess-cli
          git -C /tmp/cutechess-src rev-parse HEAD | tee /tmp/cutechess-sha.txt

      - name: Stack vs accepted Crab
        run: |
          set -euxo pipefail
          /tmp/cutechess-cli -engine name=CrabStack cmd=/tmp/crab-candidate proto=uci -engine name=CrabAccepted cmd=/tmp/crab-baseline proto=uci -each tc=3+0.03 option.Threads=1 option.Hash=64 -openings file=tools/strength/openings.pgn format=pgn order=sequential plies=8 -games 2 -rounds 256 -repeat -concurrency 2 -pgnout /tmp/candidate-vs-crab.pgn
          python3 tools/strength/summarize_match.py /tmp/candidate-vs-crab.pgn --engine CrabStack --opponent CrabAccepted --json /tmp/candidate-vs-crab.json
          cat /tmp/candidate-vs-crab.json

      - name: Stack vs immutable SF18
        run: |
          set -euxo pipefail
          /tmp/cutechess-cli -engine name=CrabStack cmd=/tmp/crab-candidate proto=uci -engine name=Stockfish18 cmd=/tmp/sf18 proto=uci -each tc=3+0.03 option.Threads=1 option.Hash=64 -openings file=tools/strength/openings.pgn format=pgn order=sequential plies=8 -games 2 -rounds 256 -repeat -concurrency 2 -pgnout /tmp/candidate-vs-sf18.pgn
          python3 tools/strength/summarize_match.py /tmp/candidate-vs-sf18.pgn --engine CrabStack --opponent Stockfish18 --json /tmp/candidate-vs-sf18.json
          cat /tmp/candidate-vs-sf18.json

      - name: Write audit manifest
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib
          def r(p):
              q=pathlib.Path(p)
              return q.read_text().strip() if q.exists() else None
          m={'experiment':'STACK-0002','base_stack':'STACK-0001','components':['EXP-0023','EXP-0025'],'wrapper_sha':r('/tmp/wrapper-sha.txt'),'accepted_crab_sha':r('/tmp/accepted-crab-sha.txt'),'immutable_sf18_sha':r('/tmp/sf18-sha.txt'),'patch_sha256':r('/tmp/patch-sha256.txt'),'engine_diff_sha256':r('/tmp/engine-diff-sha256.txt'),'post_patch_tree':r('/tmp/post-patch-tree.txt'),'candidate_bench_nodes':r('/tmp/candidate-bench-nodes.txt'),'accepted_crab_bench_nodes':2673975,'official_sf18_bench_nodes':2050811,'gcc':r('/tmp/gcc.txt'),'clang':r('/tmp/clang.txt'),'cpu':r('/tmp/cpu.txt'),'candidate_binary_sha256':r('/tmp/candidate-binary-sha256.txt'),'candidate_gcc_binary_sha256':r('/tmp/candidate-gcc-binary-sha256.txt'),'accepted_binary_sha256':r('/tmp/baseline-binary-sha256.txt'),'sf18_binary_sha256':r('/tmp/sf18-binary-sha256.txt'),'candidate_networks':r('/tmp/candidate-network-sha256.txt'),'accepted_networks':r('/tmp/baseline-network-sha256.txt'),'sf18_networks':r('/tmp/sf18-network-sha256.txt'),'opening_checksum':r('/tmp/openings-sha256.txt'),'cutechess_sha':r('/tmp/cutechess-sha.txt'),'threads':1,'hash_mb':64,'time_control':'3+0.03','concurrency':2,'games_per_leg':512,'opening_policy':'sequential 8 plies, repeated colors','adjudication':'none'}
          pathlib.Path('/tmp/audit.json').write_text(json.dumps(m,indent=2)+'\n')
          print(json.dumps(m,indent=2))
          PY

      - name: Upload STACK-0002 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stack0002-exp0023-exp0025-evidence
          path: |
            /tmp/audit.json
            /tmp/candidate-vs-crab.json
            /tmp/candidate-vs-sf18.json
            /tmp/candidate-vs-crab.pgn
            /tmp/candidate-vs-sf18.pgn
            /tmp/candidate-gcc-bench.txt
            /tmp/candidate-clang-bench-1.txt
            /tmp/candidate-clang-bench-2.txt
            /tmp/baseline-bench.txt
            /tmp/sf18-bench.txt
            /tmp/*sha256.txt
            /tmp/post-patch-tree.txt
            /tmp/cutechess-sha.txt
