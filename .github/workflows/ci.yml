name: Crab CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native:
    name: Native ${{ matrix.compiler }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            comp: gcc
          - compiler: clang
            comp: clang
    steps:
      - uses: actions/checkout@v4

      - name: Build Crab
        run: make -j2 build ARCH=x86-64 COMP=${{ matrix.comp }}

      - name: UCI identity and handshake
        run: |
          printf 'uci\nisready\nquit\n' | ./engine/src/crab | tee /tmp/crab-uci.txt
          grep -q '^id name Crab Chess ' /tmp/crab-uci.txt
          grep -q '^id author Crab Chess contributors' /tmp/crab-uci.txt
          grep -q '^uciok$' /tmp/crab-uci.txt
          grep -q '^readyok$' /tmp/crab-uci.txt

      - name: Deterministic bench gate
        run: |
          ./engine/src/crab bench 2>&1 | tee /tmp/crab-bench.txt
          grep -Eq 'Nodes searched[[:space:]]*:[[:space:]]*2050811' /tmp/crab-bench.txt
          grep -q 'Nodes/second' /tmp/crab-bench.txt

      - name: Clean generated artifacts
        if: always()
        run: |
          make clean || true
          find engine/src -maxdepth 1 -type f -name 'nn-*.nnue' -delete

  sanitizers:
    name: Sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with address + undefined sanitizers
        run: make -j2 build ARCH=x86-64 COMP=gcc sanitize='address undefined' debug=yes
      - name: UCI sanitizer smoke
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: printf 'uci\nisready\nposition startpos\ngo depth 3\nquit\n' | ./engine/src/crab
      - name: Clean generated artifacts
        if: always()
        run: |
          make clean || true
          find engine/src -maxdepth 1 -type f -name 'nn-*.nnue' -delete

  strength-tools:
    name: Strength tools smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile strength helpers
        run: python3 -m py_compile tools/strength/summarize_match.py tools/strength/run_match.py
      - name: Verify canonical matched-game command
        run: |
          python3 tools/strength/run_match.py \
            --cutechess /bin/true \
            --engine-name CrabCandidate \
            --engine-cmd /bin/true \
            --opponent-name CrabBaseline \
            --opponent-cmd /bin/true \
            --pgn /tmp/dry-run.pgn \
            --json /tmp/dry-run.json \
            --dry-run | tee /tmp/strength-dry-run.txt
          grep -q 'tc=3+0.03' /tmp/strength-dry-run.txt
          grep -q 'option.Threads=1' /tmp/strength-dry-run.txt
          grep -q 'option.Hash=64' /tmp/strength-dry-run.txt
          grep -q -- '-games 2 -rounds 256 -repeat -concurrency 2' /tmp/strength-dry-run.txt
          grep -q 'order=sequential' /tmp/strength-dry-run.txt
          grep -q 'plies=8' /tmp/strength-dry-run.txt
          grep -q 'planned games=512' /tmp/strength-dry-run.txt

  exp0004:
    if: ${{ github.head_ref == 'exp/0004-threat-weight-prefetch' }}
    name: EXP-0004 paired Clang AVX2 NPS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Record benchmark environment
        run: |
          clang++ --version
          lscpu

      - name: Verify upstream candidate patch
        run: git apply --check --directory=engine experiments/EXP-0004-threat-weight-prefetch.patch

      - name: Build control
        run: |
          make clean
          make -j2 build ARCH=x86-64-avx2 COMP=clang
          cp engine/src/crab /tmp/crab-exp0004-baseline

      - name: Apply candidate and build
        run: |
          git apply --directory=engine experiments/EXP-0004-threat-weight-prefetch.patch
          make clean
          make -j2 build ARCH=x86-64-avx2 COMP=clang
          cp engine/src/crab /tmp/crab-exp0004-candidate
          printf 'uci\nisready\nquit\n' | /tmp/crab-exp0004-candidate | tee /tmp/crab-exp0004-uci.txt
          grep -q '^id name Crab Chess ' /tmp/crab-exp0004-uci.txt
          /tmp/crab-exp0004-candidate bench 2>&1 | tee /tmp/crab-exp0004-bench.txt
          grep -Eq 'Nodes searched[[:space:]]*:[[:space:]]*2050811' /tmp/crab-exp0004-bench.txt

      - name: Run paired throughput benchmark
        run: |
          python3 tools/bench/paired_nps.py \
            /tmp/crab-exp0004-baseline \
            /tmp/crab-exp0004-candidate \
            --pairs 20 \
            --warmups 2 \
            --expected-nodes 2050811 \
            --json /tmp/exp0004.json
          cat /tmp/exp0004.json

      - name: Candidate sanitizer smoke
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          make clean
          make -j2 build ARCH=x86-64 COMP=gcc sanitize='address undefined' debug=yes
          printf 'uci\nisready\nposition startpos\ngo depth 3\nquit\n' | ./engine/src/crab

      - name: Upload experiment result
        uses: actions/upload-artifact@v4
        with:
          name: exp0004-threat-weight-prefetch-nps
          path: /tmp/exp0004.json

      - name: Clean generated artifacts
        if: always()
        run: |
          make clean || true
          find engine/src -maxdepth 1 -type f -name 'nn-*.nnue' -delete

  web:
    name: Web smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required web assets
        run: |
          test -f web/index.html
          test -f web/styles.css
          test -f web/app.js
          grep -q 'id="board"' web/index.html
          grep -q 'chess.js@1.4.0' web/app.js
