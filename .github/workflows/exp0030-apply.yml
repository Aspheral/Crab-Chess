name: EXP-0030 apply isolated candidate

on:
  push:
    branches:
      - exp/0030-syzygy-nodestime-multipv

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp/0030-syzygy-nodestime-multipv
          fetch-depth: 0

      - name: Apply guarded EXP-0030 engine diff
        shell: python
        run: |
          from pathlib import Path

          path = Path("engine/src/search.cpp")
          s = path.read_text()

          old_decl = '''void syzygy_extend_pv(const OptionsMap&            options,
                                const Search::LimitsType&    limits,
                                Crab::Position&         pos,
                                Crab::Search::RootMove& rootMove,
                                Value&                       v);'''
          new_decl = '''void syzygy_extend_pv(const OptionsMap&            options,
                                const Search::LimitsType&    limits,
                                Crab::Position&              pos,
                                Crab::Search::RootMove&      rootMove,
                                Value&                       v,
                                const size_t                 multiPV);'''

          old_impl = '''void syzygy_extend_pv(const OptionsMap&         options,
                                const Search::LimitsType& limits,
                                Position&                 pos,
                                RootMove&                 rootMove,
                                Value&                    v) {

              auto t_start      = std::chrono::steady_clock::now();
              int  moveOverhead = int(options["Move Overhead"]);
              bool rule50       = bool(options["Syzygy50MoveRule"]);

              // Do not use more than moveOverhead / 2 time, if time management is active
              auto time_abort = [&t_start, &moveOverhead, &limits]() -> bool {
                  auto t_end = std::chrono::steady_clock::now();
                  return limits.use_time_management()
                      && 2 * std::chrono::duration<double, std::milli>(t_end - t_start).count()
                           > moveOverhead;
              };

              std::list<StateInfo> sts;'''
          new_impl = '''void syzygy_extend_pv(const OptionsMap&         options,
                                const Search::LimitsType& limits,
                                Position&                 pos,
                                RootMove&                 rootMove,
                                Value&                    v,
                                const size_t              multiPV) {

              auto t_start      = std::chrono::steady_clock::now();
              int  moveOverhead = int(options["Move Overhead"]);
              bool rule50       = bool(options["Syzygy50MoveRule"]);

              // Do not use more than moveOverhead / 2 ms, if time management is active.
              // Under nodestime, local pos.do_move() calls do not consume the global node budget.
              auto time_abort = [&t_start, &moveOverhead, &limits, &multiPV]() -> bool {
                  auto t_end = std::chrono::steady_clock::now();
                  return !limits.npmsec && limits.use_time_management()
                      && 2 * multiPV * std::chrono::duration<double, std::milli>(t_end - t_start).count()
                           >= moveOverhead;
              };

              if (time_abort())
                  return;

              std::list<StateInfo> sts;'''

          old_call = '            syzygy_extend_pv(worker.options, worker.limits, pos, rootMoves[i], v);'
          new_call = '            syzygy_extend_pv(worker.options, worker.limits, pos, rootMoves[i], v, multiPV);'

          for label, old in (("declaration", old_decl), ("implementation", old_impl), ("call", old_call)):
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f"guard failed for {label}: expected 1 occurrence, got {count}")

          s = s.replace(old_decl, new_decl).replace(old_impl, new_impl).replace(old_call, new_call)
          path.write_text(s)

          record = Path("experiments/EXP-0030.md")
          record.write_text('''# EXP-0030: Syzygy PV extension nodestime determinism and MultiPV overhead\n\n## Status\nACTIVE / CORRECTNESS CANDIDATE\n\n## Baselines\n- Accepted Crab: `4b3a04bb0ab62d7bb5b575dd6cab7860bd6557d6`\n- Immutable Stockfish 18: `cb3d4ee9b47d0c5aae855b12379378ea1439675c` (`sf_18`)\n- Official SF18 deterministic bench: `2050811`\n- Upstream reference: Stockfish `19a02f44e1bfee44b5a00acf6e812c643b8fd54c`\n\n## Hypothesis / applicability\nAccepted Crab still aborts Syzygy PV extension using wall-clock milliseconds even when `nodestime` is active, and its MultiPV extension budget is not divided across displayed PVs. The upstream correction is applicable to Crab.\n\nThe candidate keeps PV extension deterministic under nodestime because local `Position::do_move()` calls do not consume the global node budget. Under ordinary time management it scales the wall-clock abort threshold by MultiPV so multiple PV extensions cannot independently consume the same half-overhead allowance.\n\n## Candidate scope\n- `engine/src/search.cpp` only for engine semantics.\n- Preserve Crab public identity and all inherited GPLv3 / Stockfish notices.\n- No NNUE, search-strength tuning, website, WASM, or unrelated changes.\n\n## Required evidence before classification\n- Clean GCC and Clang builds.\n- Crab UCI identity.\n- Deterministic Crab bench reproduced.\n- ASan/UBSan and correctness smoke.\n- NNUE/network and opening checksum validation where applicable.\n- Explicit nodestime reproducibility check covering Syzygy PV extension when tablebases are available in CI.\n- MultiPV time-budget correctness smoke where practical.\n- Immutable SF18 remains the comparison/provenance control.\n\nThis is a correctness/determinism candidate. No Elo claim is made and routine 512-game strength screening is not required unless the adaptation changes playing semantics beyond the upstream no-functional-change intent.\n''')

      - name: Verify candidate diff is isolated
        run: |
          git diff --check
          git diff -- engine/src/search.cpp experiments/EXP-0030.md

      - name: Commit candidate and remove staging workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/src/search.cpp experiments/EXP-0030.md
          git rm .github/workflows/exp0030-apply.yml
          git commit -m "EXP-0030: fix Syzygy nodestime and MultiPV PV extension"
          git push origin HEAD:exp/0030-syzygy-nodestime-multipv
