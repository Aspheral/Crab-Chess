name: Promote EXP-0004 Source

on:
  push:
    branches:
      - 'promote/exp0004-threat-weight-prefetch'

permissions:
  contents: write

jobs:
  promote:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: promote/exp0004-threat-weight-prefetch

      - name: Verify accepted baseline and audited patch
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "6354c99ac7cb7bcad7ec43418997f94cd70f48e4"
          test "$(sha256sum experiments/EXP-0004-threat-weight-prefetch.patch | awk '{print $1}')" = "f7bb808818257a37268fbaeccb1ed9e80bbd62ed13c8e11bfd3c386180553798"
          git apply --check --directory=engine experiments/EXP-0004-threat-weight-prefetch.patch

      - name: Apply exact tested engine diff
        run: |
          set -euo pipefail
          git apply --directory=engine experiments/EXP-0004-threat-weight-prefetch.patch
          actual="$(git diff --binary -- engine | sha256sum | awk '{print $1}')"
          echo "Applied engine diff SHA-256: $actual"
          test "$actual" = "25ad1f6f8d1738de9c5477d310558140243c72fdaa92aa9d76fd3b237ba436c1"
          mapfile -t changed < <(git diff --name-only -- engine | sort)
          printf '%s\n' "${changed[@]}"
          expected=(
            engine/src/misc.cpp
            engine/src/misc.h
            engine/src/nnue/features/full_threats.cpp
            engine/src/nnue/features/full_threats.h
            engine/src/nnue/nnue_accumulator.cpp
          )
          test "${changed[*]}" = "${expected[*]}"

      - name: Build and deterministic bench before commit
        run: |
          set -euo pipefail
          make clean
          make -j2 build ARCH=x86-64-avx2 COMP=clang
          engine/src/crab bench 2>&1 | tee /tmp/promotion-bench.txt
          grep -Eq 'Nodes searched[[:space:]]*:[[:space:]]*2050811' /tmp/promotion-bench.txt
          printf 'uci\nquit\n' | engine/src/crab | grep -F 'id name Crab Chess'

      - name: Commit promoted source and remove staging workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/promote-exp0004.yml
          git add engine/src/misc.cpp engine/src/misc.h \
            engine/src/nnue/features/full_threats.cpp \
            engine/src/nnue/features/full_threats.h \
            engine/src/nnue/nnue_accumulator.cpp \
            .github/workflows/promote-exp0004.yml
          git diff --cached --check
          git commit -m 'engine: promote accepted EXP-0004 threat-weight prefetch'
          git push origin HEAD:promote/exp0004-threat-weight-prefetch
