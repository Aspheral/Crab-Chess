name: Crab Strength Screen

on:
  pull_request:
    paths:
      - 'engine/**'
      - 'experiments/**'
      - 'tools/strength/**'
      - '.github/workflows/strength.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exp0035-strength:
    if: ${{ github.event_name == 'workflow_dispatch' || github.head_ref == 'exp/0035-quiet-history-gain' }}
    name: EXP-0035 matched games
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve candidate and accepted baseline
        run: |
          git fetch origin main
          BASE_SHA="$(git rev-parse origin/main)"
          test "$BASE_SHA" = "600be7ee835a9ddf04a092709245fb10e05f20e3"
          printf '%s\n' "$BASE_SHA" | tee /tmp/crab-baseline-sha.txt
          git rev-parse HEAD | tee /tmp/candidate-branch-sha.txt

      - name: Build pinned match runner
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake qtbase5-dev libqt5svg5-dev
          git clone --depth 1 --branch v1.3.1 https://github.com/cutechess/cutechess.git /tmp/cutechess-src
          cmake -S /tmp/cutechess-src -B /tmp/cutechess-build -DCMAKE_BUILD_TYPE=Release -DWITH_TESTS=OFF
          cmake --build /tmp/cutechess-build --target cli -j2
          test -x /tmp/cutechess-build/cutechess-cli
          install -m755 /tmp/cutechess-build/cutechess-cli /tmp/cutechess-cli
          /tmp/cutechess-cli --version || /tmp/cutechess-cli -version || true
          git -C /tmp/cutechess-src rev-parse HEAD | tee /tmp/cutechess-runner-sha.txt

      - name: Record host and compiler
        run: |
          uname -a | tee /tmp/host.txt
          lscpu | tee -a /tmp/host.txt
          clang++ --version | tee /tmp/compiler.txt
          git rev-parse HEAD | tee /tmp/workflow-checkout-sha.txt
          sha256sum experiments/EXP-0035-quiet-history-gain.patch | tee /tmp/candidate-patch-sha256.txt

      - name: Build accepted Crab control
        run: |
          BASE_SHA="$(cat /tmp/crab-baseline-sha.txt)"
          git worktree add --detach /tmp/crab-baseline "$BASE_SHA"
          make -C /tmp/crab-baseline clean
          make -C /tmp/crab-baseline -j2 build ARCH=x86-64-avx2 COMP=clang
          cp /tmp/crab-baseline/engine/src/crab /tmp/crab-baseline-bin
          /tmp/crab-baseline-bin bench 2>&1 | tee /tmp/baseline-bench.txt
          grep -Eq 'Nodes searched[[:space:]]*:[[:space:]]*2146293' /tmp/baseline-bench.txt

      - name: Build EXP-0035 candidate
        run: |
          make clean
          make -j2 build ARCH=x86-64-avx2 COMP=clang
          cp engine/src/crab /tmp/crab-candidate
          sha256sum /tmp/crab-candidate | tee /tmp/candidate-binary-sha256.txt
          /tmp/crab-candidate bench 2>&1 | tee /tmp/candidate-bench.txt
          grep -Eq 'Nodes searched[[:space:]]*:[[:space:]]*2146293' /tmp/candidate-bench.txt
          BASE_SHA="$(cat /tmp/crab-baseline-sha.txt)"
          git diff --binary "$BASE_SHA" -- engine | sha256sum | tee /tmp/candidate-engine-diff-sha256.txt

      - name: Build immutable Stockfish 18 control
        run: |
          git clone --filter=blob:none https://github.com/official-stockfish/Stockfish.git /tmp/stockfish
          git -C /tmp/stockfish checkout --detach cb3d4ee9b47d0c5aae855b12379378ea1439675c
          test "$(git -C /tmp/stockfish rev-parse HEAD)" = cb3d4ee9b47d0c5aae855b12379378ea1439675c
          make -C /tmp/stockfish/src -j2 build ARCH=x86-64-avx2 COMP=clang
          cp /tmp/stockfish/src/stockfish /tmp/sf18
          sha256sum /tmp/sf18 | tee /tmp/sf18-binary-sha256.txt
          /tmp/sf18 bench 2>&1 | tee /tmp/sf18-bench.txt
          grep -Eq 'Nodes searched[[:space:]]*:[[:space:]]*2050811' /tmp/sf18-bench.txt

      - name: Record network and opening checksums
        run: |
          find engine/src /tmp/stockfish/src -maxdepth 1 -type f -name 'nn-*.nnue' -print0 | sort -z | xargs -0 sha256sum | tee /tmp/network-sha256.txt
          sha256sum tools/strength/openings.pgn | tee /tmp/openings-sha256.txt

      - name: Candidate vs accepted Crab 3+0.03
        run: |
          /tmp/cutechess-cli -engine name=CrabCandidate cmd=/tmp/crab-candidate proto=uci -engine name=CrabBaseline cmd=/tmp/crab-baseline-bin proto=uci -each tc=3+0.03 option.Threads=1 option.Hash=64 -openings file=tools/strength/openings.pgn format=pgn order=sequential plies=8 -games 2 -rounds 256 -repeat -concurrency 2 -pgnout /tmp/candidate-vs-crab-3plus003.pgn
          python3 tools/strength/summarize_match.py /tmp/candidate-vs-crab-3plus003.pgn --engine CrabCandidate --opponent CrabBaseline --json /tmp/candidate-vs-crab-3plus003.json

      - name: Candidate vs immutable SF18 3+0.03
        run: |
          /tmp/cutechess-cli -engine name=CrabCandidate cmd=/tmp/crab-candidate proto=uci -engine name=Stockfish18 cmd=/tmp/sf18 proto=uci -each tc=3+0.03 option.Threads=1 option.Hash=64 -openings file=tools/strength/openings.pgn format=pgn order=sequential plies=8 -games 2 -rounds 256 -repeat -concurrency 2 -pgnout /tmp/candidate-vs-sf18-3plus003.pgn
          python3 tools/strength/summarize_match.py /tmp/candidate-vs-sf18-3plus003.pgn --engine CrabCandidate --opponent Stockfish18 --json /tmp/candidate-vs-sf18-3plus003.json

      - name: Candidate vs accepted Crab 500ms per move
        run: |
          /tmp/cutechess-cli -engine name=CrabCandidate cmd=/tmp/crab-candidate proto=uci -engine name=CrabBaseline cmd=/tmp/crab-baseline-bin proto=uci -each st=0.5 option.Threads=1 option.Hash=64 -openings file=tools/strength/openings.pgn format=pgn order=sequential plies=8 -games 2 -rounds 512 -repeat -concurrency 2 -pgnout /tmp/candidate-vs-crab-500ms.pgn
          python3 tools/strength/summarize_match.py /tmp/candidate-vs-crab-500ms.pgn --engine CrabCandidate --opponent CrabBaseline --json /tmp/candidate-vs-crab-500ms.json

      - name: Candidate vs immutable SF18 500ms per move
        run: |
          /tmp/cutechess-cli -engine name=CrabCandidate cmd=/tmp/crab-candidate proto=uci -engine name=Stockfish18 cmd=/tmp/sf18 proto=uci -each st=0.5 option.Threads=1 option.Hash=64 -openings file=tools/strength/openings.pgn format=pgn order=sequential plies=8 -games 2 -rounds 512 -repeat -concurrency 2 -pgnout /tmp/candidate-vs-sf18-500ms.pgn
          python3 tools/strength/summarize_match.py /tmp/candidate-vs-sf18-500ms.pgn --engine CrabCandidate --opponent Stockfish18 --json /tmp/candidate-vs-sf18-500ms.json

      - name: Write audit manifest
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib
          def read(p):
              q=pathlib.Path(p)
              return q.read_text().strip() if q.exists() else None
          manifest={
            'experiment':'EXP-0035',
            'candidate_branch_sha':read('/tmp/candidate-branch-sha.txt'),
            'workflow_checkout_sha':read('/tmp/workflow-checkout-sha.txt'),
            'candidate_patch_sha256':read('/tmp/candidate-patch-sha256.txt'),
            'candidate_engine_diff_sha256':read('/tmp/candidate-engine-diff-sha256.txt'),
            'candidate_binary_sha256':read('/tmp/candidate-binary-sha256.txt'),
            'accepted_crab_baseline_sha':read('/tmp/crab-baseline-sha.txt'),
            'immutable_sf18_sha':'cb3d4ee9b47d0c5aae855b12379378ea1439675c',
            'sf18_binary_sha256':read('/tmp/sf18-binary-sha256.txt'),
            'official_bench_nodes':2050811,
            'accepted_crab_bench_nodes':2146293,
            'candidate_bench_nodes':read('/tmp/candidate-bench.txt'),
            'threads':1,'hash_mb':64,
            'time_controls':['3+0.03','500ms per move'],
            'concurrency':2,
            'opening_order':'sequential, 8 plies, repeated colors',
            'adjudication':'none',
            'match_runner':'Cute Chess v1.3.1',
            'match_runner_sha':read('/tmp/cutechess-runner-sha.txt'),
            'compiler':read('/tmp/compiler.txt'),
            'host':read('/tmp/host.txt'),
            'network_checksums':read('/tmp/network-sha256.txt'),
            'opening_checksum':read('/tmp/openings-sha256.txt'),
          }
          pathlib.Path('/tmp/audit.json').write_text(json.dumps(manifest, indent=2)+'\n')
          print(json.dumps(manifest, indent=2))
          PY

      - name: Upload strength evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp0035-strength-evidence
          path: |
            /tmp/audit.json
            /tmp/candidate-vs-*.json
            /tmp/candidate-vs-*.pgn
            /tmp/candidate-bench.txt
            /tmp/baseline-bench.txt
            /tmp/sf18-bench.txt
            /tmp/network-sha256.txt
            /tmp/openings-sha256.txt
            /tmp/cutechess-runner-sha.txt
            /tmp/candidate-patch-sha256.txt
            /tmp/candidate-engine-diff-sha256.txt
            /tmp/candidate-binary-sha256.txt
            /tmp/sf18-binary-sha256.txt
