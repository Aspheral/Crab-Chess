name: EXP-0033 validation

on:
  push:
    branches:
      - experiment/exp0033-nullmove-capturedpiece
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  guarded-candidate-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record provenance
        run: |
          git rev-parse HEAD
          git fetch --no-tags origin main
          git rev-parse FETCH_HEAD

      - name: Verify guarded patch harness
        run: |
          test -x experiments/EXP-0033-nullmove-capturedpiece.apply.sh
          tmpdir="$(mktemp -d)"
          cp -a engine "$tmpdir/engine"
          experiments/EXP-0033-nullmove-capturedpiece.apply.sh "$tmpdir"
          python3 - "$tmpdir/engine" <<'PY'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          hits = []
          for path in sorted(root.rglob("*.cpp")):
              text = path.read_text(encoding="utf-8")
              count = text.count("newSt.capturedPiece = NO_PIECE;")
              if count:
                  hits.append((path, count))
          assert len(hits) == 1, hits
          assert hits[0][1] == 1, hits
          print(hits[0][0])
          PY

      - name: Build candidate copy
        run: |
          tmpdir="$(mktemp -d)"
          cp -a . "$tmpdir/crab"
          experiments/EXP-0033-nullmove-capturedpiece.apply.sh "$tmpdir/crab"
          make -C "$tmpdir/crab" build ARCH=x86-64 COMP=gcc JOBS=2
          test -x "$tmpdir/crab/engine/src/crab"

      - name: Verify Crab UCI identity
        run: |
          tmpdir="$(mktemp -d)"
          cp -a . "$tmpdir/crab"
          experiments/EXP-0033-nullmove-capturedpiece.apply.sh "$tmpdir/crab"
          make -C "$tmpdir/crab" build ARCH=x86-64 COMP=gcc JOBS=2
          printf 'uci\nquit\n' | "$tmpdir/crab/engine/src/crab" | tee /tmp/crab-uci.txt
          grep -Fq 'id name Crab Chess' /tmp/crab-uci.txt
