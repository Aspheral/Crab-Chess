name: Apply refined STACK-0001 promotion

on:
  push:
    branches:
      - automation/apply-refined-stack-0001

permissions:
  contents: write

jobs:
  apply-validated-engine-diff:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out clean promotion branch
        uses: actions/checkout@v4
        with:
          ref: promote/refined-stack-0001
          fetch-depth: 0

      - name: Verify accepted baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "27b27330bda59e87e46df552754394638c74334a"

      - name: Apply exact validated ABL-0005 engine diff
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/candidate.diff <<'PATCH'
          diff --git a/engine/src/evaluate.cpp b/engine/src/evaluate.cpp
          index 962aca1..ec6ef38 100644
          --- a/engine/src/evaluate.cpp
          +++ b/engine/src/evaluate.cpp
          @@ -78,7 +78,7 @@ Value Eval::evaluate(const Eval::NNUE::Networks&    networks,
               nnue -= nnue * nnueComplexity / 18236;
           
               int material = 534 * pos.count<PAWN>() + pos.non_pawn_material();
          -    int v        = (nnue * (77871 + material) + optimism * (7191 + material)) / 77871;
          +    int v        = nnue + (nnue * material + optimism * (7191 + material)) / 77871;
           
               // Damp down the evaluation linearly when shuffling
               v -= v * pos.rule50_count() / 199;
          diff --git a/engine/src/search.cpp b/engine/src/search.cpp
          index b2cce12..28f7d0d 100644
          --- a/engine/src/search.cpp
          +++ b/engine/src/search.cpp
          @@ -551,6 +551,16 @@ void Search::Worker::do_move(Position& pos, const Move move, StateInfo& st, Stac
           void Search::Worker::do_move(
             Position& pos, const Move move, StateInfo& st, const bool givesCheck, Stack* const ss) {
               bool capture = pos.capture_stage(move);
          +
          +    if (ss != nullptr)
          +    {
          +        const Piece  pc = pos.moved_piece(move);
          +        const Square to = move.to_sq();
          +
          +        prefetch(&(*(ss - 1)->continuationCorrectionHistory)[pc][to]);
          +        prefetch(&(*(ss - 3)->continuationCorrectionHistory)[pc][to]);
          +    }
          +
               // Preferable over fetch_add to avoid locking instructions
               nodes.store(nodes.load(std::memory_order_relaxed) + 1, std::memory_order_relaxed);
           
          @@ -929,7 +939,7 @@ Value Search::Worker::search(
               // Step 10. Internal iterative reductions
               // At sufficient depth, reduce depth for PV/Cut nodes without a TTMove.
               // (*Scaler) Making IIR more aggressive scales poorly.
          -    if (!allNode && depth >= 6 && !ttData.move && priorReduction <= 3)
          +    if (!allNode && depth >= 6 && !ttData.move)
                   depth--;
           
               // Step 11. ProbCut
          @@ -1160,6 +1170,15 @@ moves_loop:  // When in check, search starts here
                       else if (value >= beta && !is_decisive(value))
                       {
                           ttMoveHistory << std::max(-400 - 100 * depth, -4000);
          +
          +                if (!ss->inCheck && value > ss->staticEval)
          +                {
          +                    const int bonus =
          +                      std::clamp(int(value - ss->staticEval) * singularDepth * 177 / 1024,
          +                                 -CORRECTION_HISTORY_LIMIT / 4, CORRECTION_HISTORY_LIMIT / 4);
          +                    update_correction_history(pos, ss, *this, bonus);
          +                }
          +
                           return value;
                       }
           
          @@ -1307,12 +1326,32 @@ moves_loop:  // When in check, search starts here
           
                       rm.effort += nodes - nodeCount;
           
          -            rm.averageScore =
          -              rm.averageScore != -VALUE_INFINITE ? (value + rm.averageScore) / 2 : value;
          +            uint64_t N      = nodes - nodeCount;
          +            uint64_t E_prev = std::max(uint64_t(1), rm.effort - N);
          +
          +            constexpr uint64_t Scale          = 32;
          +            constexpr uint64_t ChiNumerator   = 3;
          +            constexpr uint64_t ChiDenominator = 2;
          +            constexpr uint64_t MinWeight      = 12;
          +            constexpr uint64_t MaxWeight      = 24;
          +
          +            uint64_t w =
          +              std::clamp((Scale * N * ChiDenominator)
          +                           / (N * ChiDenominator + ChiNumerator * E_prev),
          +                         MinWeight, MaxWeight);
          +            uint64_t w_mss = std::min(w, uint64_t(16));
          +            int64_t  v2    = int64_t(value) * std::abs(value);
           
          -            rm.meanSquaredScore = rm.meanSquaredScore != -VALUE_INFINITE * VALUE_INFINITE
          -                                  ? (value * std::abs(value) + rm.meanSquaredScore) / 2
          -                                  : value * std::abs(value);
          +            if (rm.averageScore == -VALUE_INFINITE)
          +                rm.averageScore = value;
          +            else
          +                rm.averageScore = Value((value * w + rm.averageScore * (Scale - w)) / Scale);
          +
          +            if (rm.meanSquaredScore == -VALUE_INFINITE * VALUE_INFINITE)
          +                rm.meanSquaredScore = value * std::abs(value);
          +            else
          +                rm.meanSquaredScore =
          +                  Value((v2 * w_mss + int64_t(rm.meanSquaredScore) * (Scale - w_mss)) / Scale);
           
                       // PV move or new best move?
                       if (moveCount == 1 || value > alpha)
          PATCH

          patch_sha=$(sha256sum /tmp/candidate.diff | awk '{print $1}')
          echo "patch_sha=$patch_sha"
          test "$patch_sha" = "db8376929cf1bdc9502679531bebf3c440eae7f3d54a7088d95ba14af27b11d6"
          git apply --check /tmp/candidate.diff
          git apply /tmp/candidate.diff
          git add engine/src/evaluate.cpp engine/src/search.cpp

          tree=$(git write-tree)
          echo "promotion_tree=$tree"
          echo "abl0005_wrapper_tree=5bf84ab4e58423d5672ae57f49f2226740886f2c"
          git diff --cached > /tmp/applied.diff
          diff_sha=$(sha256sum /tmp/applied.diff | awk '{print $1}')
          echo "diff_sha=$diff_sha"
          test "$diff_sha" = "db8376929cf1bdc9502679531bebf3c440eae7f3d54a7088d95ba14af27b11d6"

      - name: Commit exact validated engine diff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Crab Chess Automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Promote refined STACK-0001 engine diff"
          git push origin HEAD:refs/heads/promote/refined-stack-0001
