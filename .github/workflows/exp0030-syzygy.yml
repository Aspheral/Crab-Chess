name: EXP-0030 Syzygy Evidence

on:
  pull_request:

permissions:
  contents: read

jobs:
  syzygy-nodestime:
    if: ${{ github.head_ref == 'exp/0030-syzygy-nodestime-multipv' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record provenance and environment
        run: |
          set -euxo pipefail
          git rev-parse HEAD | tee /tmp/candidate-sha.txt
          git rev-parse 4b3a04bb0ab62d7bb5b575dd6cab7860bd6557d6 | tee /tmp/accepted-sha.txt
          printf '%s\n' cb3d4ee9b47d0c5aae855b12379378ea1439675c | tee /tmp/sf18-sha.txt
          gcc --version | head -1 | tee /tmp/compiler.txt
          lscpu > /tmp/lscpu.txt

      - name: Download minimal KQvK Syzygy tablebase pair
        run: |
          set -euxo pipefail
          mkdir -p /tmp/syzygy
          curl -fL --retry 3 -o /tmp/syzygy/KQvK.rtbw https://raw.githubusercontent.com/gflohr/Chess-Plisco/main/t/syzygy/KQvK.rtbw
          curl -fL --retry 3 -o /tmp/syzygy/KQvK.rtbz https://raw.githubusercontent.com/gflohr/Chess-Plisco/main/t/syzygy/KQvK.rtbz
          sha256sum /tmp/syzygy/KQvK.rtbw /tmp/syzygy/KQvK.rtbz | tee /tmp/syzygy-sha256.txt
          test -s /tmp/syzygy/KQvK.rtbw
          test -s /tmp/syzygy/KQvK.rtbz

      - name: Build candidate and accepted control
        run: |
          set -euxo pipefail
          make -j2 build ARCH=x86-64 COMP=gcc
          cp engine/src/crab /tmp/crab-exp0030
          sha256sum /tmp/crab-exp0030 | tee /tmp/candidate-binary-sha256.txt
          /tmp/crab-exp0030 bench 2>&1 | tee /tmp/candidate-bench.txt
          grep -Eq 'Nodes searched[[:space:]]*:[[:space:]]*2146293' /tmp/candidate-bench.txt
          git worktree add --detach /tmp/accepted 4b3a04bb0ab62d7bb5b575dd6cab7860bd6557d6
          make -C /tmp/accepted -j2 build ARCH=x86-64 COMP=gcc
          cp /tmp/accepted/engine/src/crab /tmp/crab-accepted
          sha256sum /tmp/crab-accepted | tee /tmp/accepted-binary-sha256.txt
          /tmp/crab-accepted bench 2>&1 | tee /tmp/accepted-bench.txt
          grep -Eq 'Nodes searched[[:space:]]*:[[:space:]]*2146293' /tmp/accepted-bench.txt

      - name: Run repeated nodestime Syzygy PV-extension checks
        run: |
          set -euxo pipefail
          cat > /tmp/run_uci.py <<'PY'
          import subprocess, sys, hashlib, pathlib

          engine, prefix = sys.argv[1], sys.argv[2]
          commands = '''uci
          setoption name Threads value 1
          setoption name Hash value 16
          setoption name SyzygyPath value /tmp/syzygy
          setoption name SyzygyProbeLimit value 3
          setoption name Move Overhead value 0
          setoption name nodestime value 100
          setoption name MultiPV value 2
          isready
          position fen 8/8/8/8/8/8/1Q6/K6k w - - 0 1
          go wtime 1000 btime 1000
          quit
          '''
          outs=[]
          for i in range(5):
              p=subprocess.run([engine], input=commands, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=30, check=True)
              out=p.stdout
              pathlib.Path(f'{prefix}-{i}.txt').write_text(out)
              if 'uciok' not in out or 'readyok' not in out:
                  raise SystemExit('UCI handshake failed')
              if 'bestmove' not in out:
                  raise SystemExit('search did not finish')
              if 'tablebase' not in out.lower():
                  raise SystemExit('no tablebase initialization evidence in output')
              # Normalize only volatile NPS/time fields; PV/bestmove/score must remain identical.
              stable=[]
              for line in out.splitlines():
                  if line.startswith('info '):
                      parts=line.split()
                      filtered=[]
                      skip=False
                      for j,t in enumerate(parts):
                          if skip:
                              skip=False; continue
                          if t in ('time','nps','hashfull') and j+1 < len(parts):
                              skip=True; continue
                          filtered.append(t)
                      line=' '.join(filtered)
                  stable.append(line)
              outs.append('\n'.join(stable))
          if len(set(outs)) != 1:
              raise SystemExit('normalized candidate outputs were not reproducible')
          digest=hashlib.sha256(outs[0].encode()).hexdigest()
          pathlib.Path(f'{prefix}-normalized.sha256').write_text(digest+'\n')
          PY
          python3 /tmp/run_uci.py /tmp/crab-exp0030 /tmp/candidate
          # Accepted control is recorded for direct behavioral context, but is not required to fail.
          python3 /tmp/run_uci.py /tmp/crab-accepted /tmp/accepted || true
          cat /tmp/candidate-normalized.sha256
          grep -i tablebase /tmp/candidate-0.txt | tee /tmp/tablebase-evidence.txt
          grep '^bestmove ' /tmp/candidate-0.txt | tee /tmp/candidate-bestmove.txt

      - name: Verify source-level MultiPV budget guard
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('engine/src/search.cpp').read_text()
          assert 'return !limits.npmsec && limits.use_time_management()' in s
          assert '2 * multiPV * std::chrono::duration<double, std::milli>' in s
          assert 'syzygy_extend_pv(worker.options, worker.limits, pos, rootMoves[i], v, multiPV);' in s
          print('EXP-0030 MultiPV/nodestime guards present')
          PY

      - name: Package targeted evidence
        if: always()
        run: |
          mkdir -p /tmp/exp0030-evidence
          cp /tmp/*sha*.txt /tmp/exp0030-evidence/ 2>/dev/null || true
          cp /tmp/*bench.txt /tmp/exp0030-evidence/ 2>/dev/null || true
          cp /tmp/candidate-*.txt /tmp/exp0030-evidence/ 2>/dev/null || true
          cp /tmp/accepted-*.txt /tmp/exp0030-evidence/ 2>/dev/null || true
          cp /tmp/tablebase-evidence.txt /tmp/candidate-bestmove.txt /tmp/compiler.txt /tmp/lscpu.txt /tmp/exp0030-evidence/ 2>/dev/null || true
          sha256sum /tmp/exp0030-evidence/* | sort | tee /tmp/exp0030-evidence/MANIFEST.sha256

      - name: Upload targeted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp0030-syzygy-evidence
          path: /tmp/exp0030-evidence
          if-no-files-found: error
